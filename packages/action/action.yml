# Delivery harness — delivery-record verification (verify mode).
#
# A composite action, deliberately: it wraps the kernel's pure
# `verifyDeliveryRecord` core and needs no hosted infrastructure, no App, and no
# credentials. Everything it does is read-only.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS CHECKS OUT THE PULL REQUEST HEAD AND NEVER THE MERGE REF
# ─────────────────────────────────────────────────────────────────────────────
#
# On a `pull_request` event, `actions/checkout` defaults to `refs/pull/N/merge`
# and `GITHUB_SHA` names a commit GitHub *fabricates* by merging the head into
# the current base tip. That commit is not the head, and verifying it would be
# wrong three ways:
#
#   1. Its tree carries base changes the author never delivered, so its
#      deliverable identity is an identity no local gate ever computed. A record
#      that verified against it would attest a tree nobody reviewed.
#   2. It is regenerated whenever the base moves, so the artifact under check
#      would change under a pull request that did not change.
#   3. It would launder base movement. The `deliveryRecordVerification.baseMovement`
#      policy exists to stale a record when the base moves; a tree with the new
#      base already folded in makes every record look fresh.
#
# So the checkout below pins `github.event.pull_request.head.sha`, and `main.ts`
# reads that same sha out of the event payload and recomputes the identity from
# *that commit's tree* through git. The working tree is never the identity
# source — which means even a workflow that checked out the wrong ref cannot
# make this check pass. `GITHUB_SHA` is reported in the summary as the commit
# that was **not** verified, and is resolved nowhere.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE BOOTSTRAP RULE
# ─────────────────────────────────────────────────────────────────────────────
#
# A delivery record is written by `delivery-harness record` *after* a local gate
# admits, and is committed to the branch. So the first pull request that
# introduces this check cannot satisfy it: at the moment its author runs the
# loop, the config that names the record path, the workflow that runs the
# verification, or both are still part of the change under review. The same
# holds for the pull request that revises `computingIdentityVersion` — an
# identity-token revision cascades, and every record computed under the old
# token stops matching by design.
#
# The rule, stated once so it is never improvised:
#
#   The pull request that INTRODUCES the verification workflow (or revises the
#   consumer's identity token) is bootstrap-exempt. The exemption is recorded in
#   the pull request itself, is granted by a human merging with the check
#   failing or absent, and is never implemented as a code path in this Action.
#   Every subsequent pull request is gated.
#
# There is deliberately no `bootstrap: true` input. An exemption that the Action
# could grant itself is an exemption an author can request forever; an exemption
# that only a repository administrator can grant, once, leaves a trail.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE PRODUCER / POLLER JOB SPLIT
# ─────────────────────────────────────────────────────────────────────────────
#
# The job that VERIFIES a record must never be the job that PRODUCES it.
#
# The reason is structural, not stylistic. Producing a record means committing a
# file to the branch, and committing to the branch moves the head. The check
# just reported would then describe a head that no longer exists, and the new
# head has no record — so a self-producing job either reports on a stale commit
# or chases its own tail forever. Worse, a job that can push is a job with write
# credentials evaluating untrusted pull request content.
#
# Split it in two:
#
#   producer — runs where the work happens (the agent's or author's workspace,
#              or a separate workflow the author dispatches). It runs the local
#              loop, `delivery-harness record`, and commits the record with the
#              change it describes. It has whatever credentials it needs; it
#              never reports a check.
#
#   poller   — this Action. `on: pull_request`, `permissions: contents: read`,
#              no credentials, no writes. It verifies whatever the head carries
#              *right now*. When the producer pushes the record, GitHub delivers
#              a `synchronize` event and the poller re-runs against the new head.
#              The re-delivery IS the polling loop: nothing waits in-process, so
#              nothing burns a runner minute waiting for a human.
#
#   jobs:
#     verify-delivery-record:
#       runs-on: ubuntu-latest
#       permissions:
#         contents: read          # read-only: this job must never be able to push
#       steps:
#         - uses: actions/setup-node@v4
#           with: { node-version: "22" }
#         - uses: ./packages/action     # or the published action reference
#
# Two things follow that are easy to get wrong:
#
#   * Do not add `pull_request_target`. It runs with the base repository's
#     privileges against an unreviewed head. `main.ts` refuses that event by
#     name rather than trusting a workflow author to have thought it through.
#   * Do not make this job `continue-on-error`. A verification that cannot fail
#     the merge is documentation, not a gate.
#
# ─────────────────────────────────────────────────────────────────────────────
# ATTESTATION HONESTY
# ─────────────────────────────────────────────────────────────────────────────
#
# This check is L0: "self / workspace-scoped — process discipline and freshness,
# not provenance". It proves that a gate ran against this exact deliverable and
# that the record has not gone stale. It does not prove WHO ran it, and it is
# not a signature. The summary says so on every run, passing or failing.

name: "Verify delivery record"
description: >-
  Fail-closed verification of the tracked delivery record against the pull
  request head — never the synthetic merge commit.
author: "delivery-harness"

inputs:
  ci-policy-id:
    description: >-
      Claim delegated-authority mode under this declared CI policy id. The claim
      is checked EXACTLY against the consumer config's `ciPolicies`: the id must
      be declared and every one of its `requiredEnv` corroborations must hold. A
      near miss is `unauthorized_automation`, never a quiet downgrade to verify
      mode. Leave unset to run in verify mode, which grants nothing and needs no
      authorization.
    required: false
    default: ""
  working-directory:
    description: "Repository root to verify. Defaults to the workspace."
    required: false
    default: ""
  fetch-depth:
    description: >-
      Checkout depth. The default of 0 (full history) is what lets git resolve
      the configured base ref and compute the merge base; a shallow clone fails
      closed with `base_ref_unresolved` or `merge_base_unavailable` rather than
      guessing.
    required: false
    default: "0"

outputs:
  verified:
    description: "`true` when the check passed."
    value: ${{ steps.verify.outputs.verified }}
  mode:
    description: "`verify` or `delegated-authority`."
    value: ${{ steps.verify.outputs.mode }}
  head-sha:
    description: "The pull request head commit whose tree was verified."
    value: ${{ steps.verify.outputs.head-sha }}
  record-path:
    description: "The tracked delivery record that was checked, if one was selected."
    value: ${{ steps.verify.outputs.record-path }}
  deliverable-digest:
    description: "The deliverable identity recomputed from the head."
    value: ${{ steps.verify.outputs.deliverable-digest }}

runs:
  using: composite
  steps:
    # The head, pinned by sha. Not `refs/pull/N/merge`, not `github.ref`, not a
    # branch name that can move between the checkout and the check.
    - name: Check out the pull request head (never the synthetic merge commit)
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: ${{ inputs.fetch-depth }}
        # This job reads. Leaving a token in the checkout would give an
        # untrusted head's build steps something to reach for.
        persist-credentials: false

    - name: Verify the tracked delivery record
      id: verify
      shell: bash
      env:
        DELIVERY_HARNESS_CI_POLICY_ID: ${{ inputs.ci-policy-id }}
        DELIVERY_HARNESS_ACTION_PATH: ${{ github.action_path }}
        DELIVERY_HARNESS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -n "${DELIVERY_HARNESS_WORKING_DIRECTORY}" ]; then
          export GITHUB_WORKSPACE="${DELIVERY_HARNESS_WORKING_DIRECTORY}"
        fi
        cd "${GITHUB_WORKSPACE}"
        # The harness is TypeScript and ships as source. Node 23.6+ strips types
        # by default; 22.18+ needs the flag. The flag is still accepted on newer
        # majors, so one invocation covers the supported range — and a runtime
        # that supports neither fails loudly here rather than skipping the check.
        node --experimental-strip-types \
             --disable-warning=ExperimentalWarning \
             "${DELIVERY_HARNESS_ACTION_PATH}/src/main.ts"
