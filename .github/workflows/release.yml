# Release checks.
#
# The two halves of "this workspace is publishable", run together:
#
#   static  — scripts/check-release.ts: one version across the root and every
#             workspace package, HARNESS_VERSION in lockstep with the kernel
#             manifest (the fingerprint rule packages/kernel/src/preparation.ts
#             states), LICENSE present and actually the Apache License 2.0,
#             every manifest's `license` field agreeing with it, workspace
#             packages packable (not private) while the root stays private.
#             Each rule is falsified in scripts/check-release.test.ts, so the
#             ordinary CI suite already fails a pull request that breaks one;
#             this workflow re-runs the same sensor as its own named check.
#
#   dry-run — `npm publish --dry-run` per package, one step each so a failure
#             names the package that cannot pack. Dry-run only: nothing here
#             publishes, tags, or authenticates. Actual publication (and the
#             compiled Action bundle the published-action form needs — see the
#             v1 boundary note in packages/action/action.yml) is deliberate
#             future release mechanics, not this workflow.
#
#   install — scripts/check-standalone-install.ts: the leg that leaves the
#             workspace. It packs all five packages, installs each tarball ALONE
#             into a temp directory outside the repository, and proves the
#             installed thing imports and runs. This is the only check in the
#             repository that exercises the standalone-install path, which is
#             precisely the path publishing creates: dry-run above verifies a
#             tarball can be BUILT, never that it can be INSTALLED, and every
#             other check — typecheck, unit suite, docs walkthrough — runs
#             inside the workspace where npm has already symlinked the siblings.
#             It lives here rather than in `npm run check` because five packs
#             and five installs are seconds, not milliseconds; the static half
#             of the same rule (`dependency-closure` in check-release.ts) is
#             pure and does run in the default suite on every leg.
#
# Triggers: every pull request that touches release surfaces, so a version or
# license regression is red before it merges rather than at release time.
# Published package sources are a release surface too — a newly added import is
# how an undeclared dependency gets in — so EVERYTHING a manifest's `files`
# ships is on the list, per package rather than only at the repo root: `src/`,
# `fixtures/` and `vectors/` for the conformance kit, and each package's own
# LICENSE and NOTICE. The bare `LICENSE`/`NOTICE` entries match the root alone,
# so without the `packages/*/` forms, deleting `packages/kernel/NOTICE` would
# not start the very workflow whose license-coherence pack-shape rule exists to
# catch it. And workflow_dispatch, to run the full set against any ref.

name: Release checks

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/*/package.json"
      - "packages/*/src/**"
      # Published source is not only `src/`: the conformance kit's runner
      # imports `fixtures/repo-config-adapter.ts`, which its `files` ships.
      - "packages/*/fixtures/**"
      - "packages/conformance/vectors/**"
      - "LICENSE"
      - "NOTICE"
      # The per-package copies. `license-coherence` checks the pack shape, and
      # npm auto-includes a license only from the package's own directory.
      - "packages/*/LICENSE"
      - "packages/*/NOTICE"
      # Redundant under `packages/*/src/**` above, kept because the
      # harness-version-lockstep rule is specifically about this file.
      - "packages/kernel/src/preparation.ts"
      - "scripts/check-release.ts"
      - "scripts/check-standalone-install.ts"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Static release sensor
        run: node --import tsx scripts/check-release.ts

      - name: Publish dry-run (kernel)
        run: npm publish --dry-run --workspace "@agent-delivery-harness/kernel"

      - name: Publish dry-run (conformance)
        run: npm publish --dry-run --workspace "@agent-delivery-harness/conformance"

      - name: Publish dry-run (cli)
        run: npm publish --dry-run --workspace "@agent-delivery-harness/cli"

      - name: Publish dry-run (mcp)
        run: npm publish --dry-run --workspace "@agent-delivery-harness/mcp"

      - name: Publish dry-run (action)
        run: npm publish --dry-run --workspace "@agent-delivery-harness/action"

      # The leg dry-run cannot be: every tarball installed alone, outside the
      # workspace, then imported and run. Offline — it resolves the five names
      # to the local tarballs through `overrides`, never a registry, which is
      # what lets it run before anything is published.
      - name: Standalone-install smoke
        run: npm run sensor:standalone
